kind = "data-app"
previewPath = "/"
title = "Fedora 43 Boot Parameter Explorer"
version = "1.0.0"
id = "artifacts/fedora-boot-params"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19087

[services.development]
run = "pnpm --filter @workspace/fedora-boot-params run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fedora-boot-params", "run", "build" ]
publicDir = "artifacts/fedora-boot-params/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19087"
BASE_PATH = "/"
