openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parameters
    description: Boot parameter operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /parameters:
    get:
      operationId: listParameters
      tags: [parameters]
      summary: List boot parameters
      description: Returns all boot parameters, optionally filtered
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: graphicsMode
          in: query
          required: false
          schema:
            type: string
            enum: [hybrid, dgpu]
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: riskLevel
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of boot parameters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BootParameter"
  /parameters/{id}:
    get:
      operationId: getParameter
      tags: [parameters]
      summary: Get a single boot parameter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Boot parameter detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootParameter"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories:
    get:
      operationId: listCategories
      tags: [parameters]
      summary: List all parameter categories
      responses:
        "200":
          description: List of categories with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /stats:
    get:
      operationId: getStats
      tags: [parameters]
      summary: Get aggregate statistics
      responses:
        "200":
          description: Summary stats for the parameter database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BootParameter:
      type: object
      required:
        - id
        - name
        - category
        - relevanceHybrid
        - relevanceDgpu
        - switches
        - verboseDescription
        - recommendedValue
        - riskLevel
        - tags
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        relevanceHybrid:
          type: integer
        relevanceDgpu:
          type: integer
        switches:
          type: string
        verboseDescription:
          type: string
        recommendedValue:
          type: string
        positionalParams:
          type: ["string", "null"]
        riskLevel:
          type: string
          enum: [safe, moderate, advanced]
        tags:
          type: array
          items:
            type: string
    Category:
      type: object
      required:
        - name
        - count
        - description
      properties:
        name:
          type: string
        count:
          type: integer
        description:
          type: string
    Stats:
      type: object
      required:
        - totalParameters
        - categoryCounts
        - riskCounts
        - topHybridParams
        - topDgpuParams
      properties:
        totalParameters:
          type: integer
        categoryCounts:
          type: array
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
              count:
                type: integer
        riskCounts:
          type: object
          required: [safe, moderate, advanced]
          properties:
            safe:
              type: integer
            moderate:
              type: integer
            advanced:
              type: integer
        topHybridParams:
          type: array
          items:
            type: object
            required: [id, name, relevanceHybrid]
            properties:
              id:
                type: string
              name:
                type: string
              relevanceHybrid:
                type: integer
        topDgpuParams:
          type: array
          items:
            type: object
            required: [id, name, relevanceDgpu]
            properties:
              id:
                type: string
              name:
                type: string
              relevanceDgpu:
                type: integer
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
